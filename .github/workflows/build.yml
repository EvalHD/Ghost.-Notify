name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZIP entpacken
        run: |
          rm -rf _app
          mkdir _app
          unzip -q ghost-notify.zip -d _app
          SETTINGS=$(find _app -name settings.gradle.kts | head -n 1)
          echo "APP_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          cd "$APP_DIR"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Ghost-Notify-APK
          path: _app/**/app/build/outputs/apk/debug/*.apk
